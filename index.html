        // 縮放按鈕改置於右上角
        L.control.zoom({ position: 'topright' }).addTo(map);
      
        // ✅ 使用官方 OpenStreetMap 免費底圖
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
      
        markersLayer.addTo(map);
    }

    function populateDistrictOptions() {
      const districts = [...new Set(coolSpotsData.map(item => item.district))].sort();
      const select = document.getElementById('district-select');
      districts.forEach(dist => {
        const option = document.createElement('option');
        option.value = dist;
        option.textContent = dist;
        select.appendChild(option);
      });
    }

    function createPopupHTML(spot) {
      return `
        <div class="p-2 max-w-xs text-milktea-800">
          <div class="flex items-center justify-between gap-2 border-b border-milktea-200 pb-2 mb-2">
            <span class="text-xs px-2 py-0.5 rounded-md font-semibold bg-milktea-200 text-milktea-800">${spot.district}</span>
            <span class="text-xs text-milktea-600 bg-milktea-100 border border-milktea-200 px-1.5 py-0.5 rounded">${spot.type}</span>
          </div>
          <h3 class="font-bold text-base text-milktea-900 mb-1 leading-snug">${spot.name}</h3>
          
          <div class="text-xs text-milktea-700 space-y-1.5 my-2">
            <p class="flex items-start gap-1.5">
              <i class="fa-solid fa-location-dot text-milktea-500 mt-0.5 shrink-0"></i>
              <span>${spot.address}</span>
            </p>
            <p class="flex items-center gap-1.5">
              <i class="fa-solid fa-clock text-milktea-500 shrink-0"></i>
              <span>${spot.hours}</span>
            </p>
            <p class="flex items-center gap-1.5">
              <i class="fa-solid fa-phone text-milktea-500 shrink-0"></i>
              <a href="tel:${spot.phone}" class="text-milktea-700 hover:underline font-medium">${spot.phone}</a>
            </p>
            ${spot.note ? `<p class="flex items-center gap-1.5 text-amber-700 bg-amber-50 p-1 rounded border border-amber-200"><i class="fa-solid fa-circle-info"></i> 備註：${spot.note}</p>` : ''}
          </div>

          <!-- Feature Badges -->
          <div class="pt-2 border-t border-milktea-200 flex flex-wrap gap-1 text-[11px]">
            ${spot.ac ? `<span class="px-1.5 py-0.5 bg-sky-50 text-sky-700 border border-sky-200 rounded flex items-center gap-1"><i class="fa-solid fa-snowflake"></i>冷氣</span>` : ''}
            ${spot.water ? `<span class="px-1.5 py-0.5 bg-blue-50 text-blue-700 border border-blue-200 rounded flex items-center gap-1"><i class="fa-solid fa-glass-water"></i>飲水</span>` : ''}
            ${spot.restroom ? `<span class="px-1.5 py-0.5 bg-amber-50 text-amber-700 border border-amber-200 rounded flex items-center gap-1"><i class="fa-solid fa-restroom"></i>廁所</span>` : ''}
            ${spot.seat ? `<span class="px-1.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded flex items-center gap-1"><i class="fa-solid fa-chair"></i>座位</span>` : ''}
            ${spot.accessible ? `<span class="px-1.5 py-0.5 bg-purple-50 text-purple-700 border border-purple-200 rounded flex items-center gap-1"><i class="fa-solid fa-wheelchair"></i>無障礙</span>` : ''}
            ${spot.fan ? `<span class="px-1.5 py-0.5 bg-orange-50 text-orange-700 border border-orange-200 rounded flex items-center gap-1"><i class="fa-solid fa-fan"></i>風扇</span>` : ''}
          </div>
        </div>
      `;
    }

    function renderMapMarkers(spots) {
      markersLayer.clearLayers();
      markerMap.clear();

      if (spots.length === 0) return;

      const bounds = L.latLngBounds();

      spots.forEach(spot => {
        const customIcon = L.divIcon({
          className: 'custom-div-icon',
          html: `<div class="marker-pin ${spot.id === activeSpotId ? 'active' : ''}"><i class="fa-solid fa-temperature-arrow-down"></i></div>`,
          iconSize: [30, 42],
          iconAnchor: [15, 42]
        });

        const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });
        marker.bindPopup(createPopupHTML(spot));

        marker.on('click', () => {
          highlightSpotCard(spot.id);
        });

        markersLayer.addLayer(marker);
        markerMap.set(spot.id, marker);
        bounds.extend([spot.lat, spot.lng]);
      });

      // Fit bounds if initialization or full view
      if (spots.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
      }
    }

    function renderSpotsList(spots) {
      const container = document.getElementById('spots-list');
      const countEl = document.getElementById('filtered-count');
      countEl.textContent = `${spots.length} 筆`;

      if (spots.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 text-milktea-500">
            <i class="fa-solid fa-circle-exclamation text-3xl mb-2"></i>
            <p class="text-sm">沒有符合條件的涼適點</p>
            <p class="text-xs text-milktea-400 mt-1">請試著放寬搜尋或篩選條件</p>
          </div>
        `;
        return;
      }

      container.innerHTML = spots.map(spot => `
        <div id="spot-card-${spot.id}" onclick="selectSpot(${spot.id})" class="p-3 bg-white rounded-xl border border-milktea-200 hover:border-milktea-400 shadow-sm hover:shadow-md transition cursor-pointer group">
          <div class="flex items-start justify-between gap-2">
            <h4 class="font-bold text-sm text-milktea-900 group-hover:text-milktea-600 transition leading-snug">${spot.name}</h4>
            <span class="text-[11px] px-2 py-0.5 rounded bg-milktea-100 text-milktea-700 shrink-0 font-medium">${spot.district}</span>
          </div>

          <p class="text-xs text-milktea-600 mt-1.5 flex items-center gap-1.5">
            <i class="fa-solid fa-location-dot text-milktea-400"></i>
            <span class="truncate">${spot.address}</span>
          </p>

          <p class="text-xs text-milktea-500 mt-1 flex items-center gap-1.5">
            <i class="fa-solid fa-clock text-milktea-400"></i>
            <span>${spot.hours}</span>
          </p>

          <div class="mt-2.5 pt-2 border-t border-milktea-100 flex flex-wrap gap-1 text-[10px]">
            ${spot.ac ? `<span class="px-1.5 py-0.5 bg-sky-50 text-sky-700 rounded"><i class="fa-solid fa-snowflake mr-0.5"></i>冷氣</span>` : ''}
            ${spot.water ? `<span class="px-1.5 py-0.5 bg-blue-50 text-blue-700 rounded"><i class="fa-solid fa-glass-water mr-0.5"></i>飲水</span>` : ''}
            ${spot.restroom ? `<span class="px-1.5 py-0.5 bg-amber-50 text-amber-700 rounded"><i class="fa-solid fa-restroom mr-0.5"></i>廁所</span>` : ''}
            ${spot.seat ? `<span class="px-1.5 py-0.5 bg-emerald-50 text-emerald-700 rounded"><i class="fa-solid fa-chair mr-0.5"></i>座位</span>` : ''}
            ${spot.accessible ? `<span class="px-1.5 py-0.5 bg-purple-50 text-purple-700 rounded"><i class="fa-solid fa-wheelchair mr-0.5"></i>無障礙</span>` : ''}
          </div>
        </div>
      `).join('');
    }

    function filterData() {
      const searchTxt = document.getElementById('search-input').value.trim().toLowerCase();
      const districtVal = document.getElementById('district-select').value;
      const acVal = document.getElementById('filter-ac').checked;
      const waterVal = document.getElementById('filter-water').checked;
      const restroomVal = document.getElementById('filter-restroom').checked;
      const seatVal = document.getElementById('filter-seat').checked;
      const accessibleVal = document.getElementById('filter-accessible').checked;

      const filtered = coolSpotsData.filter(spot => {
        // District filter
        if (districtVal !== 'ALL' && spot.district !== districtVal) return false;

        // Search text
        if (searchTxt && !spot.name.toLowerCase().includes(searchTxt) && !spot.address.toLowerCase().includes(searchTxt)) {
          return false;
        }

        // Checkbox facilities
        if (acVal && !spot.ac) return false;
        if (waterVal && !spot.water) return false;
        if (restroomVal && !spot.restroom) return false;
        if (seatVal && !spot.seat) return false;
        if (accessibleVal && !spot.accessible) return false;

        return true;
      });

      renderSpotsList(filtered);
      renderMapMarkers(filtered);
    }

    function selectSpot(id) {
      activeSpotId = id;
      const spot = coolSpotsData.find(item => item.id === id);
      if (!spot) return;

      // Center map smoothly
      map.flyTo([spot.lat, spot.lng], 16, { duration: 1.2 });

      // Open popup
      const marker = markerMap.get(id);
      if (marker) {
        marker.openPopup();
      }

      highlightSpotCard(id);

      // On mobile view, collapse sidebar when item is clicked
      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.add('translate-x-full');
      }
    }

    function highlightSpotCard(id) {
      // Clear previous active card styling
      document.querySelectorAll('#spots-list > div').forEach(el => {
        el.classList.remove('ring-2', 'ring-milktea-500', 'bg-milktea-100');
        el.classList.add('bg-white');
      });

      // Highlight active card
      const activeCard = document.getElementById(`spot-card-${id}`);
      if (activeCard) {
        activeCard.classList.remove('bg-white');
        activeCard.classList.add('ring-2', 'ring-milktea-500', 'bg-milktea-100');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function setupEventListeners() {
      // Input listeners
      document.getElementById('search-input').addEventListener('input', filterData);
      document.getElementById('district-select').addEventListener('change', filterData);
      document.getElementById('filter-ac').addEventListener('change', filterData);
      document.getElementById('filter-water').addEventListener('change', filterData);
      document.getElementById('filter-restroom').addEventListener('change', filterData);
      document.getElementById('filter-seat').addEventListener('change', filterData);
      document.getElementById('filter-accessible').addEventListener('change', filterData);

      // Reset filters button
      document.getElementById('reset-filters-btn').addEventListener('click', () => {
        document.getElementById('search-input').value = '';
        document.getElementById('district-select').value = 'ALL';
        document.getElementById('filter-ac').checked = false;
        document.getElementById('filter-water').checked = false;
        document.getElementById('filter-restroom').checked = false;
        document.getElementById('filter-seat').checked = false;
        document.getElementById('filter-accessible').checked = false;
        filterData();
      });

      // Recenter button
      document.getElementById('recenter-btn').addEventListener('click', () => {
        filterData();
      });

      // Mobile sidebar toggle
      const sidebar = document.getElementById('sidebar');
      document.getElementById('toggle-sidebar-btn').addEventListener('click', () => {
        sidebar.classList.toggle('translate-x-full');
      });
      document.getElementById('close-sidebar-btn').addEventListener('click', () => {
        sidebar.classList.add('translate-x-full');
      });
    }
  </script>
</body>
</html>
